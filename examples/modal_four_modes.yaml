# Four generic modes with explicit routes; no claim of exact MAM4 physics.
backend: modal
species:
  - {name: sulfuric_acid, density: 1700, molecular_weight: 0.098079, hygroscopicity: 0.507, optics: {source: MODAL_SU}}
  - {name: black_carbon, density: 1000, molecular_weight: 0.012011, hygroscopicity: 0, optics: {source: MODAL_BC}}
  - {name: organic, density: 1800, molecular_weight: 0.15, hygroscopicity: 0.14, optics: {source: MODAL_OC}}
  - {name: sea_salt, density: 2200, molecular_weight: 0.05844, hygroscopicity: 1.16, optics: {source: MODAL_SS}}
  - {name: dust, density: 2650, molecular_weight: 0.1, hygroscopicity: 0, optics: {source: MODAL_DU}}
  - {name: ammonium_nitrate, density: 1725, molecular_weight: 0.080043, hygroscopicity: 0.67, optics: {source: MODAL_NI}}
modes:
  - {name: nucleation, geometric_radius: 3e-9, geometric_std_dev: 1.6}
  - {name: aitken, geometric_radius: 2e-8, geometric_std_dev: 1.6}
  - {name: accumulation, geometric_radius: 1e-7, geometric_std_dev: 1.6}
  - {name: coarse, geometric_radius: 5e-7, geometric_std_dev: 1.6}
coagulation_routes:
  - {first: nucleation, second: aitken, destination: aitken}
  - {first: nucleation, second: accumulation, destination: accumulation}
  - {first: nucleation, second: coarse, destination: coarse}
  - {first: aitken, second: accumulation, destination: accumulation}
  - {first: aitken, second: coarse, destination: coarse}
  - {first: accumulation, second: coarse, destination: coarse}
transfer_routes:
  - {source: nucleation, destination: aitken, radius_threshold: 6e-9}
  - {source: aitken, destination: accumulation, radius_threshold: 4e-8}
  - {source: accumulation, destination: coarse, radius_threshold: 2e-7}
